[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scooters-codex-telegram-bot"
dynamic = ["version"]
description = "A private Telegram bridge to Codex App Server"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
voice = ["faster-whisper>=1.1,<2"]
dev = [
    "build>=1.2,<2",
    "ruff>=0.9,<1",
]

[project.scripts]
scooters-codex-telegram-bot = "scooters_codex_telegram_bot.main:main"

[tool.setuptools.dynamic]
version = {attr = "scooters_codex_telegram_bot.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
